<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pan pequeño レジ PWA - 導線最適化</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      /* 普段の画面用（印刷エリアは隠しておく） */
      @media screen {
        #print-section {
          display: none;
        }
        body {
          font-family: sans-serif;
          background-color: #fdf5e6;
          margin: 0;
          padding: 0;
          height: 100vh;
          display: flex;
          flex-direction: column;
        }
        h1 {
          margin: 5px 0;
          text-align: center;
          color: #5d4037;
          font-size: 20px;
        }
        .container {
          display: flex;
          flex: 1;
          overflow: hidden;
          padding: 10px;
          gap: 15px;
        }

        .menu-wrapper {
          flex: 1.2;
          min-width: 320px;
          display: flex;
          flex-direction: column;
        }
        .menu {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          flex: 1;
          overflow-y: auto;
          padding-right: 5px;
        }
        .item-btn {
          background-color: #fff3e0;
          border: 2px solid #deb887;
          height: 85px;
          color: #5d4037;
          font-weight: bold;
          font-size: 15px;
          cursor: pointer;
          border-radius: 10px;
        }
        .item-btn:active {
          background-color: #deb887;
          transform: scale(0.95);
        }

        .qty-panel {
          background: #efebe9;
          padding: 10px;
          border-radius: 10px;
          margin-bottom: 10px;
          display: flex;
          flex-direction: column;
          gap: 5px;
        }
        .qty-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 5px;
        }
        .qty-btn {
          height: 40px;
          border: 1px solid #8d6e63;
          background: white;
          border-radius: 5px;
          font-weight: bold;
          cursor: pointer;
        }
        .qty-btn.active {
          background: #8d6e63;
          color: white;
        }

        .control-panel {
          margin-top: 10px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .main-controls {
          display: flex;
          gap: 8px;
        }
        .undo-btn {
          background-color: #f0ad4e;
          color: white;
          width: 100%;
          height: 55px;
          border: none;
          font-size: 16px;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
        }

        /* ★ お釣りの下に配置するボタンのレイアウト設定を追加 */
        .action-buttons {
          display: flex;
          gap: 10px;
          margin-top: 15px;
        }
        .print-btn {
          background-color: #4caf50;
          color: white;
          flex: 1.2;
          height: 60px;
          border: none;
          font-size: 18px;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
        }
        .clear-btn {
          background-color: #d9534f;
          color: white;
          flex: 1;
          height: 60px;
          border: none;
          font-size: 18px;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
        }

        .report-btn {
          background-color: #5bc0de;
          color: white;
          height: 40px;
          border: none;
          font-size: 15px;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
        }

        .receipt-container {
          flex: 1.5;
          display: flex;
          background: white;
          border: 2px solid #333;
          box-shadow: 5px 5px 0px #ccc;
          padding: 15px;
          gap: 20px;
        }
        .receipt-left {
          flex: 1;
          display: flex;
          flex-direction: column;
          border-right: 2px solid #eee;
          padding-right: 15px;
          min-width: 200px;
        }
        #item-list {
          flex: 1;
          overflow-y: auto;
          text-align: left;
          font-size: 16px;
        }
        .total-area {
          font-size: 32px;
          font-weight: bold;
          margin-top: 5px;
          text-align: right;
          color: #d32f2f;
          border-top: 3px solid #333;
          padding-top: 5px;
        }

        .receipt-right {
          width: 320px;
          display: flex;
          flex-direction: column;
          justify-content: flex-start;
        }
        .tenkey-container {
          background: #f5f5f5;
          padding: 12px;
          border-radius: 12px;
          border: 1px solid #ddd;
        }
        .tenkey-display {
          background: white;
          border: 2px solid #999;
          font-size: 32px;
          padding: 5px 15px;
          text-align: right;
          margin-bottom: 12px;
          height: 45px;
          line-height: 45px;
          font-family: monospace;
          font-weight: bold;
        }
        .tenkey-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
        }
        .tenkey-btn {
          height: 60px;
          font-size: 24px;
          background: white;
          border: 1px solid #bbb;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
          box-shadow: 0 3px 0 #ccc;
        }
        .tenkey-btn:active,
        .print-btn:active,
        .clear-btn:active {
          transform: translateY(3px);
          box-shadow: none;
        }
        .tenkey-clear {
          background: #cfd8dc;
        }

        .change-display {
          font-size: 30px;
          color: #1976d2;
          font-weight: bold;
          text-align: right;
          margin-top: 15px;
          border-top: 2px dashed #ccc;
          padding-top: 10px;
        }

        #report-modal {
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: white;
          border: 3px solid #333;
          padding: 20px;
          z-index: 100;
          width: 90%;
          max-width: 500px;
          border-radius: 15px;
        }
        .modal-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 99;
        }
        table {
          width: 100%;
          border-collapse: collapse;
        }
        th,
        td {
          border: 1px solid #ccc;
          padding: 10px;
          text-align: right;
        }
        .csv-btn {
          background-color: #2e7d32;
          color: white;
          margin-top: 15px;
          width: 100%;
          height: 50px;
          border: none;
          font-size: 18px;
          border-radius: 10px;
          cursor: pointer;
        }
        .reset-sales-btn {
          background-color: #d9534f;
          color: white;
          margin-top: 10px;
          width: 100%;
          height: 40px;
          border: none;
          font-size: 16px;
          border-radius: 10px;
          cursor: pointer;
        }
      }

      /* ★ 印刷用のデザイン */
      @media print {
        @page {
          margin: 0;
          size: 58mm auto;
        }
        html,
        body {
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        body * {
          visibility: hidden;
        }
        #print-section,
        #print-section * {
          visibility: visible;
        }
        #print-section {
          position: absolute;
          left: 0;
          top: 0;
          width: 50mm;
          margin: 0;
          padding: 5px 4mm 5px 4mm;
          font-family: sans-serif;
          color: black;
          font-size: 12px;
          line-height: 1.4;
        }
        .p-item {
          display: flex;
          justify-content: space-between;
          margin-bottom: 3px;
        }
        .p-line {
          border-top: 1px dashed black;
          margin: 5px 0;
        }
        .p-bold {
          font-weight: bold;
        }
        .p-right {
          text-align: right;
        }
        .p-center {
          text-align: center;
        }

        .p-title {
          font-size: 22px;
          font-weight: normal;
          text-align: center;
          margin-bottom: 2px;
        }
        .p-subtitle {
          font-size: 14px;
          font-weight: normal;
          text-align: center;
          margin-bottom: 8px;
        }

        .p-total {
          font-size: 14px;
          font-weight: bold;
        }

        .p-thanks {
          font-size: 16px;
          text-align: center;
          font-family: "Brush Script MT", "Comic Sans MS", cursive;
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="print-section"></div>

    <h1>🥖 pan pequeño (ぺけぱん) レジ 🥐</h1>

    <div class="container">
      <!-- 左側：パンのボタン・操作エリア（元に戻しました） -->
      <div class="menu-wrapper">
        <div class="qty-panel">
          <div
            style="
              font-size: 13px;
              font-weight: bold;
              color: #5d4037;
              margin-bottom: 5px;
            "
          >
            個数を選択してからパンを押す：
          </div>
          <div class="qty-grid">
            <button id="qty1" class="qty-btn active" onclick="setQty(1)">
              ×1
            </button>
            <button id="qty2" class="qty-btn" onclick="setQty(2)">×2</button>
            <button id="qty3" class="qty-btn" onclick="setQty(3)">×3</button>
            <button id="qty4" class="qty-btn" onclick="setQty(4)">×4</button>
            <button id="qty5" class="qty-btn" onclick="setQty(5)">×5</button>
            <button id="qty6" class="qty-btn" onclick="setQty(6)">×6</button>
            <button id="qty7" class="qty-btn" onclick="setQty(7)">×7</button>
            <button id="qty8" class="qty-btn" onclick="setQty(8)">×8</button>
            <button id="qty9" class="qty-btn" onclick="setQty(9)">×9</button>
            <button id="qty10" class="qty-btn" onclick="setQty(10)">×10</button>
          </div>
        </div>

        <div class="menu" id="button-container"></div>

        <div class="control-panel">
          <div class="main-controls">
            <!-- レシート・確定ボタンはお引越ししたので、ここは「一つ戻る」だけにします -->
            <button class="undo-btn" onclick="undoItem()">一つ戻る</button>
          </div>
          <button class="report-btn" onclick="showReport()">
            📈 本日の売上を確認
          </button>
        </div>
      </div>

      <!-- 右側：会計・テンキーエリア（元に戻しました） -->
      <div class="receipt-container">
        <div class="receipt-left">
          <h3 style="margin: 0 0 10px 0; font-size: 18px">注文内容</h3>
          <div id="item-list"></div>
          <div class="total-area">合計: <span id="total-price">0</span>円</div>
        </div>

        <div class="receipt-right">
          <div class="tenkey-container">
            <div
              style="
                font-size: 14px;
                color: #666;
                font-weight: bold;
                margin-bottom: 5px;
              "
            >
              お預かり金額
            </div>
            <div id="cash-display" class="tenkey-display">0</div>
            <div class="tenkey-grid">
              <button class="tenkey-btn" onclick="pressKey('7')">7</button>
              <button class="tenkey-btn" onclick="pressKey('8')">8</button>
              <button class="tenkey-btn" onclick="pressKey('9')">9</button>
              <button class="tenkey-btn" onclick="pressKey('4')">4</button>
              <button class="tenkey-btn" onclick="pressKey('5')">5</button>
              <button class="tenkey-btn" onclick="pressKey('6')">6</button>
              <button class="tenkey-btn" onclick="pressKey('1')">1</button>
              <button class="tenkey-btn" onclick="pressKey('2')">2</button>
              <button class="tenkey-btn" onclick="pressKey('3')">3</button>
              <button class="tenkey-btn" onclick="pressKey('0')">0</button>
              <button class="tenkey-btn" onclick="pressKey('00')">00</button>
              <button class="tenkey-btn tenkey-clear" onclick="pressKey('C')">
                C
              </button>
            </div>
          </div>

          <div id="change-area" class="change-display">
            お釣り: <span id="change">0</span>円
          </div>

          <!-- ★ ここに「レシート」と「会計確定」のボタンを新しく配置しました！ -->
          <div class="action-buttons">
            <button class="print-btn" onclick="printReceipt()">
              🧾 レシート
            </button>
            <button class="clear-btn" onclick="resetCalcManual()">
              会計確定
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeReport()"></div>
    <div id="report-modal">
      <h2 style="text-align: center">📊 本日の売上集計</h2>
      <table id="report-table">
        <thead>
          <tr>
            <th>商品名</th>
            <th>個数</th>
            <th>金額</th>
          </tr>
        </thead>
        <tbody id="report-body"></tbody>
      </table>
      <h3
        id="report-total"
        style="text-align: right; color: #d32f2f; margin-top: 15px"
      ></h3>
      <button class="csv-btn" onclick="downloadCSV()">CSVで保存する</button>
      <button class="reset-sales-btn" onclick="clearSalesData()">
        ⚠️ 売上データをゼロにリセットする
      </button>
      <button
        onclick="closeReport()"
        style="
          width: 100%;
          margin-top: 10px;
          height: 45px;
          border: 1px solid #ccc;
          background: white;
          border-radius: 10px;
        "
      >
        閉じる
      </button>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }

      const products = [
        { name: "全粒粉", price: 1400 },
        { name: "全粒粉 1/2", price: 700 },
        { name: "長いパン", price: 350 },
        { name: "自家製酵母", price: 1200 },
        { name: "自家製酵母 1/2", price: 600 },
        { name: "山食", price: 600 },
        { name: "クロワッサン", price: 280 },
        { name: "スコーン", price: 250 },
        { name: "うずまき", price: 350 },
        { name: "アーモンドクリーム", price: 400 },
        { name: "ホワイトソースパン", price: 450 },
        { name: "コーンマヨ", price: 380 },
      ];

      let total = 0;
      let cashInput = "0";
      let currentQty = 1;
      let currentOrder = [];
      let dailySales = {};

      products.forEach((p) => (dailySales[p.name] = { count: 0, total: 0 }));

      const savedSales = localStorage.getItem("bakerySalesData");
      if (savedSales) {
        const parsedSales = JSON.parse(savedSales);
        for (const name in parsedSales) {
          if (dailySales[name]) {
            dailySales[name].count = parsedSales[name].count;
            dailySales[name].total = parsedSales[name].total;
          }
        }
      }

      const container = document.getElementById("button-container");
      products.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "item-btn";
        btn.innerHTML = `${p.name}<br>${p.price.toLocaleString()}円`;
        btn.onclick = () => addItem(p.name, p.price);
        container.appendChild(btn);
      });

      function setQty(num) {
        currentQty = num;
        for (let i = 1; i <= 10; i++) {
          document.getElementById("qty" + i).classList.remove("active");
        }
        document.getElementById("qty" + num).classList.add("active");
      }

      function addItem(name, price) {
        if (parseInt(cashInput) > 0 && currentOrder.length > 0) {
          autoCommitOrder();
        }
        const subtotal = price * currentQty;
        total += subtotal;
        currentOrder.push({ name: name, price: price, qty: currentQty });
        renderItemList();
        updateDisplay();
        setQty(1);
      }

      function autoCommitOrder() {
        currentOrder.forEach((item) => {
          dailySales[item.name].count += item.qty;
          dailySales[item.name].total += item.price * item.qty;
        });
        localStorage.setItem("bakerySalesData", JSON.stringify(dailySales));
        total = 0;
        cashInput = "0";
        currentOrder = [];
        document.getElementById("item-list").innerHTML = "";
      }

      function renderItemList() {
        const list = document.getElementById("item-list");
        list.innerHTML = "";
        currentOrder.forEach((item) => {
          const itemElement = document.createElement("div");
          itemElement.style.borderBottom = "1px dashed #ddd";
          itemElement.style.padding = "5px 0";
          itemElement.style.display = "flex";
          itemElement.style.justifyContent = "space-between";
          const qtyText =
            item.qty > 1
              ? ` <span style='color:red; font-weight:bold;'>×${item.qty}</span>`
              : "";
          const itemSubtotal = item.price * item.qty;
          itemElement.innerHTML = `<span>・${item.name}${qtyText}</span><span>${itemSubtotal.toLocaleString()}円</span>`;
          list.appendChild(itemElement);
        });
        list.scrollTop = list.scrollHeight;
      }

      function undoItem() {
        if (currentOrder.length > 0) {
          const lastItem = currentOrder.pop();
          total -= lastItem.price * lastItem.qty;
          renderItemList();
          updateDisplay();
        }
      }

      function resetCalcManual() {
        if (currentOrder.length === 0) {
          cashInput = "0";
          updateDisplay();
          return;
        }
        if (confirm("現在のお会計を確定して画面をクリアしますか？")) {
          autoCommitOrder();
          updateDisplay();
          setQty(1);
        }
      }

      function printReceipt() {
        if (currentOrder.length === 0) {
          alert("印刷する注文がありません。");
          return;
        }

        const printSection = document.getElementById("print-section");

        let html = "<div class='p-title'>pan pequeño</div>";
        html += "<div class='p-subtitle'>- ぺけぱん -</div>";
        html += "<div class='p-line'></div>";

        currentOrder.forEach((item) => {
          let qtyText = item.qty > 1 ? ` x${item.qty}` : "";
          html += `<div class='p-item'>
                            <span>${item.name}${qtyText}</span>
                            <span>${item.price * item.qty}円</span>
                         </div>`;
        });

        html += "<div class='p-line'></div>";
        html += `<div class='p-right p-total'>合計: ${total}円</div>`;
        html += `<div class='p-right'>お預かり: ${parseInt(cashInput)}円</div>`;

        const change = parseInt(cashInput) - total;
        html += `<div class='p-right'>お釣り: ${change >= 0 ? change : 0}円</div>`;
        html += "<div class='p-line'></div>";

        html += "<div class='p-thanks'>thank you!</div>";

        html += "<div style='height: 160px;'></div>";

        printSection.innerHTML = html;

        window.print();

        setTimeout(() => {
          autoCommitOrder();
          updateDisplay();
          setQty(1);
        }, 1000);
      }

      function pressKey(key) {
        if (key === "C") {
          cashInput = "0";
        } else if (key === "00") {
          if (cashInput !== "0") cashInput += "00";
        } else {
          if (cashInput === "0") {
            cashInput = key;
          } else {
            cashInput += key;
          }
        }
        if (cashInput.length > 10) cashInput = cashInput.slice(0, 10);
        updateDisplay();
      }

      function updateDisplay() {
        document.getElementById("total-price").innerText =
          total.toLocaleString();
        document.getElementById("cash-display").innerText =
          parseInt(cashInput).toLocaleString();
        const change = parseInt(cashInput) - total;
        document.getElementById("change").innerText =
          change >= 0 && total > 0 ? change.toLocaleString() : 0;
      }

      function showReport() {
        const body = document.getElementById("report-body");
        body.innerHTML = "";
        let grandTotal = 0;
        for (const name in dailySales) {
          body.innerHTML += `<tr><td style="text-align:left;">${name}</td><td>${dailySales[name].count}</td><td>${dailySales[name].total.toLocaleString()}円</td></tr>`;
          grandTotal += dailySales[name].total;
        }
        document.getElementById("report-total").innerText =
          `総合計: ${grandTotal.toLocaleString()}円`;
        document.getElementById("modal-overlay").style.display = "block";
        document.getElementById("report-modal").style.display = "block";
      }

      function downloadCSV() {
        let csvContent = "\ufeff商品名,個数,売上金額\n";
        let grandTotal = 0;
        for (const name in dailySales) {
          csvContent += `${name},${dailySales[name].count},${dailySales[name].total}\n`;
          grandTotal += dailySales[name].total;
        }
        csvContent += `合計,,${grandTotal}\n`;
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `sales_${new Date().toLocaleDateString().replace(/\//g, "")}.csv`;
        link.click();
      }

      function clearSalesData() {
        if (
          confirm(
            "本当に本日の売上データをすべてゼロにしますか？\n（CSV保存をしてから実行してください）",
          )
        ) {
          products.forEach(
            (p) => (dailySales[p.name] = { count: 0, total: 0 }),
          );
          localStorage.removeItem("bakerySalesData");
          alert("売上データをリセットしました。明日の営業の準備が整いました。");
          closeReport();
        }
      }

      function closeReport() {
        document.getElementById("modal-overlay").style.display = "none";
        document.getElementById("report-modal").style.display = "none";
      }
    </script>
  </body>
</html>
